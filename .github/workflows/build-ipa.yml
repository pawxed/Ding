name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Project
        run: xcodegen generate

      - name: Build for iOS Simulator (compiler check)
        run: |
          set -o pipefail
          xcodebuild -scheme Ding \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO build

      - name: Archive unsigned build
        run: |
          mkdir -p build
          xcodebuild archive \
            -scheme Ding \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Ding.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Ding.xcarchive/Products/Applications/Ding.app"
          PAYLOAD_DIR="build/ipa_payload/Payload"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"
          cd build/ipa_payload
          zip -r -X "$PWD/../Ding.ipa" Payload
          cd ../..
          ls -lh build/Ding.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ding-unsigned-IPA
          path: build/Ding.ipa
          retention-days: 7