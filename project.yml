name: Ding
options:
  bundleIdPrefix: com.ding
  deploymentTarget:
    iOS: "11.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Ding:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
      - Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Ding
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.ding.app
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: ""
    scheme:
      testTargets: []
      gatherCoverageData: false